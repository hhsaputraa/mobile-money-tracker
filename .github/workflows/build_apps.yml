name: Build Android APK & iOS IPA

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di tab GitHub Actions

env:
  # Menghilangkan warning deprecation Node.js 20 yang dipaksa ke Node.js 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true

jobs:
  # -------------------------------------------------------------
  # 1. BUILD ANDROID APK
  # -------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Create .env.json from GitHub Secrets
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          echo "{\"API_BASE_URL\":\"$API_BASE_URL\",\"AES_KEY\":\"$AES_KEY\"}" > .env.json

      - name: Build Obfuscated Release APK (Split ABI)
        run: |
          flutter build apk --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols \
            --dart-define-from-file=.env.json

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARUS-KAS-Android-APK
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  # -------------------------------------------------------------
  # 2. BUILD iOS IPA (Unsigned / Direct Sideload Ready)
  # -------------------------------------------------------------
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Create .env.json from GitHub Secrets
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          echo "{\"API_BASE_URL\":\"$API_BASE_URL\",\"AES_KEY\":\"$AES_KEY\"}" > .env.json

      - name: Build Obfuscated iOS (No Codesign)
        run: |
          flutter build ios --release --no-codesign \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols \
            --dart-define-from-file=.env.json

      - name: Package into .IPA (Payload structure)
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ARUS-KAS-iOS.ipa Payload/

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARUS-KAS-iOS-IPA
          path: build/ios/iphoneos/ARUS-KAS-iOS.ipa
          if-no-files-found: error
